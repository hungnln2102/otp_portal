server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Chống tuyệt đối việc cache index.html để client luôn nhận bundle mới nhất
    location = /system/index.html {
        alias /usr/share/nginx/html/system/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Cache tài nguyên assets có gắn mã hash
    location ~* ^/system/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tài nguyên script tĩnh anime / hiệu ứng
    location ^~ /system/scripts/ {
        alias /usr/share/nginx/html/system/scripts/;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Tuyến chính phục vụ SPA /system và /system/<slug>
    location = /system {
        return 301 /system/;
    }

    location ^~ /system/ {
        alias /usr/share/nginx/html/system/;
        index index.html;
        try_files $uri $uri/ /system/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Phục vụ tài nguyên /assets/ (fonts, holidays, background) tương thích ngược
    location /assets/ {
        alias /usr/share/nginx/html/system/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Phục vụ tài nguyên /scripts/ trực tiếp tương thích ngược
    location /scripts/ {
        alias /usr/share/nginx/html/system/scripts/;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Tuyến Bảng Giá công khai (mavrykpremium.com/price)
    location = /price {
        try_files /system/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /price/ {
        try_files /system/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Tương thích ngược URL cũ /otp -> /system/
    location = /otp {
        return 301 /system/;
    }

    location ^~ /otp/ {
        return 301 /system/;
    }

    # Trang chủ Portal (mavrykpremium.com/)
    location = / {
        try_files /system/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
